type Query {
  "Get SharkAttacks filtered "
  FactsMngSharkAttackListing(
    filterInput: FactsMngSharkAttackFilterInput
    paginationInput: FactsMngSharkAttackPaginationInput
    sortInput: FactsMngSharkAttackSortInput
  ): FactsMngSharkAttackListing
  "Get SharkAttack by its id"
  FactsMngSharkAttack(id: ID!, organizationId: String!): FactsMngSharkAttack
  "Get up to 5 related SharkAttack cases from the same country"
  FactsMngSharkAttackRelatedCases(
    country: String!
  ): [FactsMngRelatedSharkAttack]
}

type Mutation {
