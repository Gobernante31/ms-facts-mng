  ): FactsMngSharkAttack
  "Deletes an SharkAttack"
  FactsMngDeleteSharkAttacks(ids: [ID]!): CommandResponse
  "Import SharkAttacks from OpenDataSoft"
  FactsMngImportSharkAttacks(
    input: FactsMngSharkAttackImportInput!
  ): FactsMngImportSharkAttacksResponse
}

type Subscription {
