services:
  # CURRICULUM DATA API (replacement for the retired OpenDataSoft catalog)
  shark-attack-data-api:
    profiles: ["curriculum-data"]
    build:
      context: ./services/shark-attack-data-api
    image: nebulae-university/shark-attack-data-api:local
    ports:
      - "${SHARK_ATTACK_API_PORT:-8989}:8080"
    environment:
      PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ##################################
  #### infrastructure SERVICES ####
  ##################################

  broker-mqtt:
    image: eclipse-mosquitto:1.6
    ports:
      - "9001:9001"
      - "1883:1883"
    volumes:
      - NEBULAE_MQTT:/mosquitto/data

  store-mongo:
    image: mongo:4
    ports:
      - "27017:27017"
    environment:
      - storageEngine=wiredTiger
    volumes:
      - NEBULAE_MONGO:/data/db

  nats-io:
    image: nats:latest
    ports:
      - "4222:4222"
    command: -js -c /etc/nats/nats-server.conf
    volumes:
      - NEBULAE_NATS:/nats/db
      - ./nats-server.conf:/etc/nats/nats-server.conf

  redis:
    image: redis:7.0.11-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1000 --loglevel warning
    volumes:
      - NEBULAE_REDIS:/data

  ##################################
  #### KEYCLOAK ####################
  ##################################

  keycloak_db:
    image: postgres:15
    restart: unless-stopped

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: 6jhVPaQWhgEMl0sXPnNmkLfS

    ports:
      - "15432:5432"

    volumes:
      - NEBULAE_KC_DATA:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1

    command:
      - start-dev

    restart: unless-stopped

    depends_on:
      - keycloak_db

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL_HOST: keycloak_db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: 6jhVPaQWhgEMl0sXPnNmkLfS

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"

    ports:
      - "8080:8080"

volumes:
  NEBULAE_MQTT:
  NEBULAE_MONGO:
  NEBULAE_NATS:
  NEBULAE_REDIS:
  NEBULAE_KC_DATA:
